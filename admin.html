<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapCoin Admin</title>
<style>
:root{--bg:#0a0d14;--surface:#141a26;--surface2:#1b2334;--border:rgba(255,255,255,.08);--text:#f2f4f8;--muted:#8b93a7;--gold:#f6b73c;--green:#34d399;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:19px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
h2{font-size:11.5px;margin:0 0 10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:14px;width:100%;font-family:inherit}
input::placeholder{color:var(--muted)}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;min-width:0}
button{background:var(--gold);color:#45290a;border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-family:inherit;cursor:pointer}
button:active{transform:scale(.96)}
.gray{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px}
.stat small{color:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
td,th{padding:7px 4px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
th{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px}
tr[data-id]{cursor:pointer}
tr[data-id]:active{background:var(--surface2)}
.banflag{color:var(--red);font-weight:700}
.msg{font-size:12.5px;color:var(--green);margin-top:8px;min-height:16px;word-break:break-all}
.msg.err{color:var(--red)}
.note{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<h1>🪙 TapCoin Admin</h1>

<div class="card">
  <h2>Access</h2>
  <div class="row"><input id="api" placeholder="Worker URL (https://...workers.dev)"></div>
  <div class="row"><input id="key" type="password" placeholder="Admin password"></div>
  <div class="row"><button id="loadBtn">Load data</button></div>
  <div class="msg" id="authMsg"></div>
</div>

<div class="card" id="statsCard" style="display:none">
  <h2>Overview</h2>
  <div class="grid" id="statGrid"></div>
</div>

<div class="card" id="actCard" style="display:none">
  <h2>Actions</h2>
  <div class="row"><input id="userId" type="number" placeholder="User ID"></div>
  <div class="row"><input id="amount" type="number" placeholder="Amount (negative to remove)"></div>
  <div class="row">
    <button data-act="add">Add coins</button>
    <button class="gray" data-act="set">Set balance</button>
    <button class="gray" data-act="ban">Ban</button>
    <button class="gray" data-act="unban">Unban</button>
  </div>
  <p class="note">Tip: tap any user row below to fill their ID here.</p>
  <div class="msg" id="actMsg"></div>
</div>

<div class="card" id="topCard" style="display:none">
  <h2>Top users</h2>
  <table><thead><tr><th>ID</th><th>Name</th><th>Coins</th><th>Ref</th><th>Device</th></tr></thead><tbody id="topBody"></tbody></table>
</div>

<div class="card" id="recentCard" style="display:none">
  <h2>Recent users</h2>
  <table><thead><tr><th>ID</th><th>Name</th><th>Coins</th><th>Ref</th><th>Device</th></tr></thead><tbody id="recentBody"></tbody></table>
</div>

<script>
function cfg(){
  return {
    api: localStorage.getItem('tc_adm_api') || '',
    key: localStorage.getItem('tc_adm_key') || ''
  };
}
document.getElementById('api').value = cfg().api;
document.getElementById('key').value = cfg().key;

async function call(path, body){
  const c = cfg();
  const res = await fetch(c.api.replace(/\/+$/,'') + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': c.key },
    body: JSON.stringify(body || {})
  });
  const d = await res.json();
  if (!d.ok) throw new Error(d.error || 'Error');
  return d;
}

function msg(id, text, err){
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle('err', !!err);
}

function renderRows(tbodyId, rows){
  const tb = document.getElementById(tbodyId);
  tb.innerHTML = '';
  rows.forEach(function(u){
    const tr = document.createElement('tr');
    tr.setAttribute('data-id', u.user_id);
    const dev = u.device_id ? u.device_id.slice(-6) : '—';
    tr.innerHTML = '<td>' + u.user_id + '</td><td>' + (u.name || '?') + (u.banned ? ' <span class="banflag">⛔</span>' : '') +
      '</td><td>' + u.balance + '</td><td>' + u.invited + '</td><td>' + dev + '</td>';
    tr.addEventListener('click', function(){ document.getElementById('userId').value = u.user_id; window.scrollTo(0,0); });
    tb.appendChild(tr);
  });
}

async function loadData(){
  localStorage.setItem('tc_adm_api', document.getElementById('api').value.trim());
  localStorage.setItem('tc_adm_key', document.getElementById('key').value);
  msg('authMsg', 'Loading…');
  try {
    const d = await call('/api/admin/stats');
    msg('authMsg', '✅ Connected');
    const s = d.stats;
    document.getElementById('statGrid').innerHTML =
      '<div class="stat"><b>' + s.users + '</b><small>USERS</small></div>' +
      '<div class="stat"><b>' + Number(s.coins).toLocaleString() + '</b><small>COINS HELD</small></div>' +
      '<div class="stat"><b>' + Number(s.earned).toLocaleString() + '</b><small>TOTAL EARNED</small></div>' +
      '<div class="stat"><b>' + Number(s.taps).toLocaleString() + '</b><small>TAPS</small></div>' +
      '<div class="stat"><b>' + s.invites + '</b><small>REFERRALS</small></div>' +
      '<div class="stat"><b>' + s.new24 + '</b><small>NEW 24H</small></div>';
    document.getElementById('statsCard').style.display = 'block';
    document.getElementById('actCard').style.display = 'block';
    document.getElementById('topCard').style.display = 'block';
    document.getElementById('recentCard').style.display = 'block';
    renderRows('topBody', d.top);
    renderRows('recentBody', d.recent);
  } catch(e){
    msg('authMsg', '❌ ' + e.message, true);
  }
}
document.getElementById('loadBtn').addEventListener('click', loadData);

document.querySelectorAll('[data-act]').forEach(function(b){
  b.addEventListener('click', async function(){
    const userId = document.getElementById('userId').value;
    const amount = document.getElementById('amount').value;
    if (!userId){ msg('actMsg', 'Enter a user ID (tap a row)', true); return; }
    try {
      const r = await call('/api/admin/action', { action: b.dataset.act, userId: userId, amount: amount });
      const u = r.user;
      msg('actMsg', '✅ ' + b.dataset.act + ' → ' + (u ? u.name + ' (#' + u.user_id + ') now has ' + u.balance + ' coins' + (u.banned ? ' ⛔' : '') : 'done'));
      loadData();
    } catch(e){
      msg('actMsg', '❌ ' + e.message, true);
    }
  });
});
</script>
</body>
</html>
